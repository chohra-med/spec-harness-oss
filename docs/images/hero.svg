<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Spec Harness</title>
  <desc id="d">A ticket goes through independent checks, and a reviewed correction becomes a rule the next ticket obeys.</desc>
  <rect x="1" y="1" width="1198" height="398" rx="16" fill="#0E0E10" stroke="#26262A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#71717A">OPEN SOURCE  ·  MIT  ·  CLAUDE CODE + CODEX</text>
    <rect x="64" y="92" width="56" height="3" fill="#3BA9AE"/>
    <text x="64" y="170" font-size="62" font-weight="700" fill="#FAFAF8">Spec Harness</text>
    <text x="64" y="220" font-size="28" fill="#FAFAF8">AI coding with a checker that says</text>
    <text x="64" y="256" font-size="28" fill="#FAFAF8">PASS or FAIL.</text>
    <rect x="64" y="298" width="400" height="58" rx="10" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="88" y="335" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#3BA9AE">/sdd init_</text>

    <rect x="720" y="52" width="392" height="80" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="746" y="86" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">YOUR TICKET</text>
    <text x="746" y="115" font-size="20" fill="#FAFAF8">One piece of work, in full</text>

    <path d="M916 132 V170" stroke="#3BA9AE" stroke-width="2" fill="none"/>
    <path d="M910 162 L916 172 L922 162" stroke="#3BA9AE" stroke-width="2" fill="none"/>

    <rect x="720" y="172" width="392" height="80" rx="12" fill="#0E0E10" stroke="#3BA9AE" stroke-width="2"/>
    <text x="746" y="206" font-size="14" letter-spacing="1.5" fill="#3BA9AE" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">FRESH CHECKS</text>
    <text x="746" y="235" font-size="20" fill="#FAFAF8">Tester, verifier, reviewer</text>

    <path d="M916 252 V290" stroke="#3BA9AE" stroke-width="2" fill="none"/>
    <path d="M910 282 L916 292 L922 282" stroke="#3BA9AE" stroke-width="2" fill="none"/>

    <rect x="720" y="292" width="392" height="80" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="746" y="326" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">NEXT TICKET</text>
    <text x="746" y="355" font-size="20" fill="#FAFAF8">Obeys the rule the last one taught</text>
  </g>
</svg>
