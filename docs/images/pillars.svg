<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">The three pillars of Spec Harness</title>
  <desc id="d">Memory bank at the bottom fixes cold starts and invented files. Spec-driven development in the middle gives a path from ticket to checkable tasks. The harness on top adds the ratchet, verifier, tester and learning loop.</desc>
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="#0E0E10" stroke="#26262A" stroke-width="2"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="44" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">THE PILLAR</text>
    <text x="520" y="44" font-size="14" letter-spacing="1.5" fill="#71717A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">THE PROBLEM IT REMOVES</text>

    <rect x="48" y="60" width="430" height="96" rx="12" fill="#0E0E10" stroke="#3BA9AE" stroke-width="2"/>
    <text x="72" y="98" font-size="24" font-weight="700" fill="#FAFAF8">3  Harness</text>
    <text x="72" y="128" font-size="16" fill="#71717A">ratchet, verifier, tester, learning loop</text>
    <text x="520" y="98" font-size="20" fill="#FAFAF8">The AI marks its own homework.</text>
    <text x="520" y="128" font-size="16" fill="#71717A">A fresh agent checks the goal and says PASS or FAIL.</text>

    <rect x="48" y="170" width="430" height="96" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="72" y="208" font-size="24" font-weight="700" fill="#FAFAF8">2  Spec-driven development</text>
    <text x="72" y="238" font-size="16" fill="#71717A">spec, goal, plan, tasks, build</text>
    <text x="520" y="208" font-size="20" fill="#FAFAF8">"Build it" is too vague to check.</text>
    <text x="520" y="238" font-size="16" fill="#71717A">Every ticket becomes a goal with checkable lines.</text>

    <rect x="48" y="280" width="430" height="96" rx="12" fill="#161618" stroke="#26262A" stroke-width="2"/>
    <text x="72" y="318" font-size="24" font-weight="700" fill="#FAFAF8">1  Memory bank</text>
    <text x="72" y="348" font-size="16" fill="#71717A">.memory/ files plus an index of your code</text>
    <text x="520" y="318" font-size="20" fill="#FAFAF8">Every session starts cold.</text>
    <text x="520" y="348" font-size="16" fill="#71717A">The AI reads the project's memory and invents fewer files.</text>

    <text x="600" y="404" font-size="14" text-anchor="middle" fill="#71717A">Each layer stands on the one below it.</text>
  </g>
</svg>
